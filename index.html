<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111111">
    <title>Lustige Kamera 📸</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: #111;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .stage {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #video, #snapshot {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Selfie-Kamera spiegeln, damit Vorschau natürlich wirkt */
        #video.mirror { transform: scaleX(-1); }

        .status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 1rem 1.5rem;
            background: rgba(0,0,0,0.7);
            border-radius: 12px;
            text-align: center;
            max-width: 80%;
            display: none;
        }
        .status.show { display: block; }

        /* Filter-Leiste oben */
        .filters {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0) + 0.75rem);
            left: 0;
            right: 0;
            display: flex;
            gap: 0.5rem;
            padding: 0 0.75rem;
            overflow-x: auto;
            scrollbar-width: none;
            z-index: 2;
        }
        .filters::-webkit-scrollbar { display: none; }

        .filter-btn {
            flex: 0 0 auto;
            padding: 0.5rem 0.9rem;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s, border-color 0.2s;
        }
        .filter-btn.active {
            background: #fff;
            color: #111;
            border-color: #fff;
        }

        /* Steuerleiste unten */
        .controls {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0) + 1.5rem);
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 1.5rem;
            z-index: 2;
        }

        .btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s, background 0.2s;
        }
        .btn:active { transform: scale(0.92); }

        .shutter {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: #fff;
            border: 5px solid rgba(255,255,255,0.35);
            background-clip: padding-box;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .shutter:active { transform: scale(0.93); }

        .hidden { display: none !important; }

        /* Kurzer Weißblitz beim Auslösen */
        .flash {
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 3;
        }
        .flash.fire {
            animation: flash 0.35s ease-out;
        }
        @keyframes flash {
            0% { opacity: 0.9; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="stage">
        <video id="video" autoplay playsinline muted></video>
        <img id="snapshot" class="hidden" alt="Aufnahme">
        <canvas id="canvas" class="hidden"></canvas>
        <div class="flash" id="flash"></div>

        <div class="filters" id="filters">
            <button class="filter-btn active" data-filter="none">Original</button>
            <button class="filter-btn" data-filter="grayscale(1)">S/W</button>
            <button class="filter-btn" data-filter="sepia(1)">Sepia</button>
            <button class="filter-btn" data-filter="invert(1)">Negativ</button>
            <button class="filter-btn" data-filter="hue-rotate(90deg) saturate(1.5)">Alien</button>
            <button class="filter-btn" data-filter="saturate(3) contrast(1.2)">Knallig</button>
            <button class="filter-btn" data-filter="contrast(1.8) brightness(1.1)">Krass</button>
            <button class="filter-btn" data-filter="blur(3px)">Verschwommen</button>
            <button class="filter-btn" data-filter="hue-rotate(180deg)">Retro</button>
        </div>

        <div class="controls" id="liveControls">
            <button class="btn" id="switchBtn" title="Kamera wechseln">🔄</button>
            <button class="shutter" id="shootBtn" title="Aufnehmen"></button>
            <div style="width:56px"></div>
        </div>

        <div class="controls hidden" id="reviewControls">
            <button class="btn" id="retryBtn" title="Nochmal">↩️</button>
            <button class="btn" id="downloadBtn" title="Speichern" style="width:78px;height:78px;font-size:1.8rem">💾</button>
            <button class="btn" id="shareBtn" title="Teilen">📤</button>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const snapshot = document.getElementById('snapshot');
        const flash = document.getElementById('flash');
        const status = document.getElementById('status');
        const filtersEl = document.getElementById('filters');
        const liveControls = document.getElementById('liveControls');
        const reviewControls = document.getElementById('reviewControls');
        const switchBtn = document.getElementById('switchBtn');
        const shootBtn = document.getElementById('shootBtn');
        const retryBtn = document.getElementById('retryBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const shareBtn = document.getElementById('shareBtn');

        let stream = null;
        let facingMode = 'user';
        let currentFilter = 'none';
        let lastBlob = null;

        function showStatus(msg) {
            status.textContent = msg;
            status.classList.add('show');
        }
        function hideStatus() {
            status.classList.remove('show');
        }

        async function startCamera() {
            hideStatus();
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: facingMode } },
                    audio: false
                });
                video.srcObject = stream;
                video.classList.toggle('mirror', facingMode === 'user');
            } catch (err) {
                // Fallback: einfach irgendeine Kamera
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = stream;
                    video.classList.toggle('mirror', facingMode === 'user');
                } catch (err2) {
                    showStatus('Kein Kamera-Zugriff: ' + (err2.message || err2.name) +
                        '\n\nTipp: HTTPS nötig (oder localhost) und Berechtigung erteilen.');
                }
            }
        }

        switchBtn.addEventListener('click', () => {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            startCamera();
        });

        filtersEl.addEventListener('click', (e) => {
            const btn = e.target.closest('.filter-btn');
            if (!btn) return;
            currentFilter = btn.dataset.filter;
            video.style.filter = currentFilter;
            filtersEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        });

        shootBtn.addEventListener('click', () => {
            if (!video.videoWidth) return;

            flash.classList.remove('fire');
            void flash.offsetWidth;
            flash.classList.add('fire');

            const w = video.videoWidth;
            const h = video.videoHeight;
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.filter = currentFilter;

            if (facingMode === 'user') {
                ctx.translate(w, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0, w, h);

            canvas.toBlob((blob) => {
                lastBlob = blob;
                snapshot.src = URL.createObjectURL(blob);
            }, 'image/png');

            video.classList.add('hidden');
            snapshot.classList.remove('hidden');
            liveControls.classList.add('hidden');
            reviewControls.classList.remove('hidden');
        });

        retryBtn.addEventListener('click', () => {
            if (snapshot.src.startsWith('blob:')) URL.revokeObjectURL(snapshot.src);
            snapshot.src = '';
            lastBlob = null;
            snapshot.classList.add('hidden');
            video.classList.remove('hidden');
            reviewControls.classList.add('hidden');
            liveControls.classList.remove('hidden');
        });

        downloadBtn.addEventListener('click', () => {
            if (!lastBlob) return;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(lastBlob);
            a.download = 'lustiges-bild-' + Date.now() + '.png';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        });

        shareBtn.addEventListener('click', async () => {
            if (!lastBlob) return;
            const file = new File([lastBlob], 'lustiges-bild.png', { type: 'image/png' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ files: [file], title: 'Lustiges Bild' });
                } catch (e) { /* abgebrochen */ }
            } else {
                downloadBtn.click();
            }
        });

        // Kamera beenden, wenn Tab versteckt wird (Akku sparen)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            } else if (!document.hidden && !stream && video.classList.contains('hidden') === false) {
                startCamera();
            }
        });

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showStatus('Dein Browser unterstützt getUserMedia nicht.');
        } else {
            startCamera();
        }
    </script>
</body>
</html>
