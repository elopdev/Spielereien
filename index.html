<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>FunCam 😎✨</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            overscroll-behavior: none;
        }

        /* Emoji font stack for consistent rendering */
        .emoji-font {
            font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', 'Android Emoji', emoji, sans-serif;
        }

        .stage {
            position: fixed;
            inset: 0;
            background: #000;
            overflow: hidden;
        }

        #video, #snapshot {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #video.mirror { transform: scaleX(-1); }

        /* Layer for draggable stickers */
        .sticker-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .sticker {
            position: absolute;
            left: 0;
            top: 0;
            font-size: 80px;
            line-height: 1;
            padding: 8px;
            cursor: grab;
            pointer-events: auto;
            touch-action: none;
            will-change: transform;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
            transform-origin: center;
        }
        .sticker.text {
            font-family: 'Impact', 'Anton', 'Arial Black', sans-serif;
            font-size: 56px;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            -webkit-text-stroke: 3px #000;
            text-shadow: 0 4px 0 #000, 0 0 20px rgba(255,255,255,0.5);
            white-space: nowrap;
        }
        .sticker:active { cursor: grabbing; }
        .sticker.selected {
            outline: 2px dashed rgba(255,255,255,0.7);
            outline-offset: -4px;
            border-radius: 12px;
        }

        /* Flash on capture */
        .flash {
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
        }
        .flash.fire { animation: flash 0.35s ease-out; }
        @keyframes flash {
            0% { opacity: 0.95; }
            100% { opacity: 0; }
        }

        /* ============ TOP: filter chips ============ */
        .top-bar {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0) + 0.6rem);
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            gap: 0.4rem;
            padding: 0 0.75rem;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .top-bar::-webkit-scrollbar { display: none; }

        .chip {
            flex: 0 0 auto;
            padding: 0.45rem 0.85rem;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.15s, background 0.2s;
        }
        .chip:active { transform: scale(0.95); }
        .chip.active {
            background: linear-gradient(135deg, #ff4e8a, #ff9b4e);
            border-color: transparent;
            color: #fff;
        }

        /* ============ STICKER PALETTE (bottom sheet) ============ */
        .palette-wrap {
            position: absolute;
            left: 0;
            right: 0;
            bottom: calc(env(safe-area-inset-bottom, 0) + 110px);
            z-index: 10;
            padding: 0.5rem 0;
            background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0));
            transform: translateY(110%);
            transition: transform 0.25s cubic-bezier(.4,.1,.3,1);
        }
        .palette-wrap.open { transform: translateY(0); }

        .palette {
            display: flex;
            gap: 0.3rem;
            padding: 0.5rem 0.75rem;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .palette::-webkit-scrollbar { display: none; }

        .sticker-opt {
            flex: 0 0 auto;
            width: 54px;
            height: 54px;
            font-size: 32px;
            line-height: 1;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, background 0.2s;
        }
        .sticker-opt:active { transform: scale(0.9); background: rgba(255,255,255,0.25); }
        .sticker-opt.text-btn {
            font-size: 18px;
            font-weight: 900;
            font-family: Impact, sans-serif;
            background: linear-gradient(135deg, #4ef0ff, #4e7bff);
        }
        .sticker-opt.trash {
            background: linear-gradient(135deg, #ff4e6a, #ff2d5a);
            font-size: 24px;
        }

        /* ============ BOTTOM CONTROLS ============ */
        .controls {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0) + 1.2rem);
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 2rem;
        }

        .btn {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.18);
            color: #fff;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.12s, background 0.2s;
        }
        .btn:active { transform: scale(0.9); }
        .btn.active {
            background: linear-gradient(135deg, #ff4e8a, #ff9b4e);
            border-color: transparent;
        }

        .shutter {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: #fff;
            border: 5px solid rgba(255,255,255,0.35);
            background-clip: padding-box;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 0 0 2px #fff;
        }
        .shutter:active { transform: scale(0.92); }

        .hidden { display: none !important; }

        /* Status/error overlay */
        .status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 1.25rem 1.5rem;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            text-align: center;
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.5;
            z-index: 50;
            display: none;
            white-space: pre-line;
        }
        .status.show { display: block; }

        /* Small hint that auto-fades */
        .hint {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0) + 3.5rem);
            left: 50%;
            transform: translateX(-50%);
            padding: 0.5rem 1rem;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border-radius: 999px;
            font-size: 0.8rem;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .hint.show { opacity: 1; }
    </style>
</head>
<body>

    <script>
    (() => {
        const video = document.getElementById('video');
        const snapshot = document.getElementById('snapshot');
        const flash = document.getElementById('flash');
        const status = document.getElementById('status');
        const hint = document.getElementById('hint');
        const filters = document.getElementById('filters');
        const palette = document.getElementById('palette');
        const paletteWrap = document.getElementById('paletteWrap');
        const paletteBtn = document.getElementById('paletteBtn');
        const stickerLayer = document.getElementById('stickerLayer');
        const liveControls = document.getElementById('liveControls');
        const reviewControls = document.getElementById('reviewControls');
        const switchBtn = document.getElementById('switchBtn');
        const shootBtn = document.getElementById('shootBtn');
        const retryBtn = document.getElementById('retryBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const shareBtn = document.getElementById('shareBtn');
        const addTextBtn = document.getElementById('addTextBtn');
        const clearBtn = document.getElementById('clearBtn');

        let stream = null;
        let facingMode = 'user';
        let currentFilter = 'none';
        let lastBlob = null;
        const stickers = [];

        // ========== CAMERA ==========
        const showStatus = (msg) => { status.textContent = msg; status.classList.add('show'); };
        const hideStatus = () => status.classList.remove('show');

        async function startCamera() {
            hideStatus();
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: facingMode }, width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
                video.srcObject = stream;
                video.classList.toggle('mirror', facingMode === 'user');
            } catch (err) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = stream;
                    video.classList.toggle('mirror', facingMode === 'user');
                } catch (err2) {
                    showStatus('Kein Kamera-Zugriff 😬\n\n' + (err2.message || err2.name) +
                        '\n\nBrauche HTTPS (oder localhost) und Kamera-Berechtigung.');
                }
            }
        }

        switchBtn.addEventListener('click', () => {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            startCamera();
        });

        // ========== FILTERS ==========
        filters.addEventListener('click', (e) => {
            const chip = e.target.closest('.chip');
            if (!chip) return;
            currentFilter = chip.dataset.filter;
            video.style.filter = currentFilter;
            filters.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
        });

        // ========== PALETTE TOGGLE ==========
        let paletteOpen = false;
        function togglePalette(force) {
            paletteOpen = typeof force === 'boolean' ? force : !paletteOpen;
            paletteWrap.classList.toggle('open', paletteOpen);
            paletteBtn.classList.toggle('active', paletteOpen);
        }
        paletteBtn.addEventListener('click', () => togglePalette());

        // ========== STICKERS ==========
        palette.addEventListener('click', (e) => {
            const opt = e.target.closest('.sticker-opt');
            if (!opt) return;
            if (opt === addTextBtn || opt === clearBtn) return;
            const emoji = opt.dataset.emoji;
            if (emoji) addSticker({ type: 'emoji', content: emoji });
        });

        addTextBtn.addEventListener('click', () => {
            const text = prompt('Was soll draufstehen?', 'LOL');
            if (text && text.trim()) addSticker({ type: 'text', content: text.trim().slice(0, 40) });
        });

        clearBtn.addEventListener('click', () => {
            while (stickers.length) {
                const s = stickers.pop();
                s.element.remove();
            }
        });

        function addSticker({ type, content }) {
            const el = document.createElement('div');
            el.className = 'sticker' + (type === 'text' ? ' text' : ' emoji-font');
            el.textContent = content;

            const s = {
                type, content, element: el,
                x: window.innerWidth / 2,
                y: window.innerHeight / 2 - 40,
                scale: 1,
                rotation: 0,
            };
            attachGestures(s);
            updateTransform(s);
            stickerLayer.appendChild(el);
            stickers.push(s);

            // Auto-show hint on first sticker
            if (stickers.length === 1) {
                hint.classList.add('show');
                setTimeout(() => hint.classList.remove('show'), 2800);
            }
            // Auto-close palette for more screen space
            togglePalette(false);
        }

        function updateTransform(s) {
            s.element.style.transform =
                `translate(-50%, -50%) translate(${s.x}px, ${s.y}px) rotate(${s.rotation}rad) scale(${s.scale})`;
        }

        function attachGestures(sticker) {
            const el = sticker.element;
            const pointers = new Map();
            let gesture = null;
            let lastTap = 0;

            const snapshotGesture = () => {
                const pts = [...pointers.values()];
                if (pts.length === 1) {
                    gesture = { mode: 'drag', x: sticker.x, y: sticker.y, startX: pts[0].x, startY: pts[0].y };
                } else if (pts.length >= 2) {
                    const dx = pts[1].x - pts[0].x;
                    const dy = pts[1].y - pts[0].y;
                    gesture = {
                        mode: 'transform',
                        x: sticker.x, y: sticker.y,
                        scale: sticker.scale, rotation: sticker.rotation,
                        dist: Math.hypot(dx, dy) || 1,
                        angle: Math.atan2(dy, dx),
                        cx: (pts[0].x + pts[1].x) / 2,
                        cy: (pts[0].y + pts[1].y) / 2,
                    };
                } else {
                    gesture = null;
                }
            };

            const onMove = (e) => {
                if (!pointers.has(e.pointerId)) return;
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (!gesture) return;
                const pts = [...pointers.values()];
                if (gesture.mode === 'drag' && pts.length === 1) {
                    sticker.x = gesture.x + (pts[0].x - gesture.startX);
                    sticker.y = gesture.y + (pts[0].y - gesture.startY);
                } else if (gesture.mode === 'transform' && pts.length >= 2) {
                    const dx = pts[1].x - pts[0].x;
                    const dy = pts[1].y - pts[0].y;
                    const dist = Math.hypot(dx, dy);
                    const angle = Math.atan2(dy, dx);
                    const cx = (pts[0].x + pts[1].x) / 2;
                    const cy = (pts[0].y + pts[1].y) / 2;
                    sticker.scale = Math.max(0.25, Math.min(6, gesture.scale * (dist / gesture.dist)));
                    sticker.rotation = gesture.rotation + (angle - gesture.angle);
                    sticker.x = gesture.x + (cx - gesture.cx);
                    sticker.y = gesture.y + (cy - gesture.cy);
                }
                updateTransform(sticker);
            };

            const onUp = (e) => {
                pointers.delete(e.pointerId);
                snapshotGesture();
                if (pointers.size === 0) {
                    document.removeEventListener('pointermove', onMove);
                    document.removeEventListener('pointerup', onUp);
                    document.removeEventListener('pointercancel', onUp);
                }
            };

            el.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                // Double-tap to delete (single-pointer taps within 350 ms)
                if (pointers.size === 1) {
                    const now = Date.now();
                    if (now - lastTap < 350) {
                        const idx = stickers.indexOf(sticker);
                        if (idx >= 0) stickers.splice(idx, 1);
                        el.remove();
                        return;
                    }
                    lastTap = now;
                }

                // Bring to front
                stickerLayer.appendChild(el);

                snapshotGesture();

                if (pointers.size === 1) {
                    document.addEventListener('pointermove', onMove);
                    document.addEventListener('pointerup', onUp);
                    document.addEventListener('pointercancel', onUp);
                }
            });
        }

        // ========== CAPTURE ==========
        shootBtn.addEventListener('click', () => {
            if (!video.videoWidth) return;

            flash.classList.remove('fire');
            void flash.offsetWidth;
            flash.classList.add('fire');

            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const W = Math.round(window.innerWidth * dpr);
            const H = Math.round(window.innerHeight * dpr);

            const canvas = document.createElement('canvas');
            canvas.width = W;
            canvas.height = H;
            const ctx = canvas.getContext('2d');

            // Cover-fit math
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            const scale = Math.max(W / vw, H / vh);
            const dw = vw * scale;
            const dh = vh * scale;
            const dx = (W - dw) / 2;
            const dy = (H - dh) / 2;

            // Draw video with filter + mirror if needed
            ctx.save();
            ctx.filter = currentFilter;
            if (facingMode === 'user') {
                ctx.translate(W, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(video, W - dx - dw, dy, dw, dh);
            } else {
                ctx.drawImage(video, dx, dy, dw, dh);
            }
            ctx.restore();

            // Draw stickers (screen coords * dpr) - no filter on these
            ctx.filter = 'none';
            for (const s of stickers) {
                ctx.save();
                ctx.translate(s.x * dpr, s.y * dpr);
                ctx.rotate(s.rotation);
                ctx.scale(s.scale * dpr, s.scale * dpr);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 12;
                ctx.shadowOffsetY = 4;
                if (s.type === 'text') {
                    ctx.font = '900 56px Impact, "Arial Black", sans-serif';
                    ctx.fillStyle = '#fff';
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 6;
                    ctx.lineJoin = 'round';
                    const txt = s.content.toUpperCase();
                    ctx.strokeText(txt, 0, 0);
                    ctx.fillText(txt, 0, 0);
                } else {
                    ctx.font = '80px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
                    ctx.fillStyle = '#fff';
                    ctx.fillText(s.content, 0, 0);
                }
                ctx.restore();
            }

            canvas.toBlob((blob) => {
                if (!blob) return;
                lastBlob = blob;
                snapshot.src = URL.createObjectURL(blob);
            }, 'image/png');

            video.classList.add('hidden');
            stickerLayer.style.display = 'none';
            snapshot.classList.remove('hidden');
            liveControls.classList.add('hidden');
            reviewControls.classList.remove('hidden');
            paletteWrap.style.display = 'none';
            filters.style.display = 'none';
            togglePalette(false);
        });

        retryBtn.addEventListener('click', () => {
            if (snapshot.src.startsWith('blob:')) URL.revokeObjectURL(snapshot.src);
            snapshot.src = '';
            lastBlob = null;
            snapshot.classList.add('hidden');
            video.classList.remove('hidden');
            stickerLayer.style.display = '';
            reviewControls.classList.add('hidden');
            liveControls.classList.remove('hidden');
            paletteWrap.style.display = '';
            filters.style.display = '';
        });

        downloadBtn.addEventListener('click', () => {
            if (!lastBlob) return;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(lastBlob);
            a.download = 'funcam-' + Date.now() + '.png';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1500);
        });

        shareBtn.addEventListener('click', async () => {
            if (!lastBlob) return;
            const file = new File([lastBlob], 'funcam.png', { type: 'image/png' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try { await navigator.share({ files: [file], title: 'FunCam' }); } catch (e) {}
            } else {
                downloadBtn.click();
            }
        });

        // Keep camera alive wisely
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            } else if (!document.hidden && !stream && !video.classList.contains('hidden')) {
                startCamera();
            }
        });

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showStatus('Dein Browser kann keine Kamera öffnen 😞');
        } else {
            startCamera();
        }
    })();
    </script>
</body>
</html>
