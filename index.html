<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Frame</title>
    <style>
        :root {
            --bg: #000;
            --fg: #f5f5f5;
            --muted: #9a9a9a;
            --line: rgba(255,255,255,0.14);
            --glass: rgba(22,22,22,0.58);
            --glass-strong: rgba(10,10,10,0.78);
            --accent: #f5b324;
            --danger: #ff5a4e;
            --ease: cubic-bezier(.22,.61,.36,1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            font-feature-settings: "tnum" 1, "cv02" 1;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            overscroll-behavior: none;
            letter-spacing: 0.01em;
        }

        button {
            font: inherit;
            color: inherit;
            background: none;
            border: 0;
            cursor: pointer;
            touch-action: manipulation;
        }

        .stage {
            position: fixed;
            inset: 0;
            background: #000;
            overflow: hidden;
        }

        #video, #snapshot {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }
        #video.mirror { transform: scaleX(-1); }

        /* Rule-of-thirds grid overlay */
        .grid {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s var(--ease);
        }
        .grid.on { opacity: 1; }
        .grid::before, .grid::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(to right, transparent calc(33.333% - 0.5px), rgba(255,255,255,0.28) calc(33.333% - 0.5px), rgba(255,255,255,0.28) calc(33.333% + 0.5px), transparent calc(33.333% + 0.5px)),
                linear-gradient(to right, transparent calc(66.666% - 0.5px), rgba(255,255,255,0.28) calc(66.666% - 0.5px), rgba(255,255,255,0.28) calc(66.666% + 0.5px), transparent calc(66.666% + 0.5px));
        }
        .grid::after {
            background:
                linear-gradient(to bottom, transparent calc(33.333% - 0.5px), rgba(255,255,255,0.28) calc(33.333% - 0.5px), rgba(255,255,255,0.28) calc(33.333% + 0.5px), transparent calc(33.333% + 0.5px)),
                linear-gradient(to bottom, transparent calc(66.666% - 0.5px), rgba(255,255,255,0.28) calc(66.666% - 0.5px), rgba(255,255,255,0.28) calc(66.666% + 0.5px), transparent calc(66.666% + 0.5px));
        }

        /* Top HUD */
        .hud {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0) + 0.75rem);
            left: 0;
            right: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            gap: 0.5rem;
        }

        .hud-group {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            height: 34px;
            padding: 0 0.7rem;
            background: var(--glass);
            backdrop-filter: blur(16px) saturate(130%);
            -webkit-backdrop-filter: blur(16px) saturate(130%);
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--fg);
            transition: background 0.2s var(--ease), color 0.2s var(--ease), transform 0.15s var(--ease);
        }
        .pill:active { transform: scale(0.96); }
        .pill.icon-only { padding: 0; width: 34px; justify-content: center; }
        .pill.on { color: var(--accent); border-color: rgba(245,179,36,0.5); }
        .pill.on .dot { background: var(--accent); }

        .pill .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
            display: inline-block;
        }

        .icon {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        .icon.sm { width: 14px; height: 14px; }
        .icon.lg { width: 22px; height: 22px; }

        /* Filters strip */
        .filters {
            position: absolute;
            left: 0;
            right: 0;
            bottom: calc(env(safe-area-inset-bottom, 0) + 170px);
            z-index: 15;
            display: flex;
            gap: 0.4rem;
            padding: 0 1rem;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x mandatory;
            transform: translateY(0);
            transition: opacity 0.25s var(--ease), transform 0.3s var(--ease);
        }
        .filters::-webkit-scrollbar { display: none; }
        .filters.hidden-soft { opacity: 0; pointer-events: none; transform: translateY(8px); }

        .chip {
            flex: 0 0 auto;
            scroll-snap-align: center;
            padding: 0.4rem 0.85rem;
            background: var(--glass);
            backdrop-filter: blur(14px) saturate(130%);
            -webkit-backdrop-filter: blur(14px) saturate(130%);
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            transition: color 0.2s var(--ease), background 0.2s var(--ease), transform 0.15s var(--ease);
        }
        .chip:active { transform: scale(0.96); }
        .chip.active {
            color: var(--bg);
            background: var(--fg);
            border-color: var(--fg);
        }

        /* Zoom rail */
        .zoom-rail {
            position: absolute;
            left: 50%;
            bottom: calc(env(safe-area-inset-bottom, 0) + 220px);
            transform: translateX(-50%);
            z-index: 14;
            display: flex;
            gap: 0.25rem;
            padding: 0.25rem;
            background: var(--glass-strong);
            backdrop-filter: blur(16px) saturate(140%);
            -webkit-backdrop-filter: blur(16px) saturate(140%);
            border: 1px solid var(--line);
            border-radius: 999px;
        }
        .zoom-btn {
            width: 42px;
            height: 34px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--muted);
            transition: background 0.2s var(--ease), color 0.2s var(--ease);
        }
        .zoom-btn.active {
            background: rgba(255,255,255,0.08);
            color: var(--accent);
        }

        /* Bottom bar */
        .bottom {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 20;
            padding: 1.5rem 1.25rem calc(env(safe-area-inset-bottom, 0) + 1.25rem);
            background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 1rem;
        }

        .controls .left, .controls .right {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .thumb {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05) no-repeat center/cover;
            border: 1px solid var(--line);
            overflow: hidden;
            position: relative;
            transition: transform 0.15s var(--ease);
        }
        .thumb:active { transform: scale(0.94); }
        .thumb.empty::after {
            content: "";
            position: absolute;
            inset: 30%;
            border: 1.5px dashed rgba(255,255,255,0.25);
            border-radius: 4px;
        }

        .icon-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            color: var(--fg);
            transition: transform 0.12s var(--ease), background 0.2s var(--ease), color 0.2s var(--ease);
        }
        .icon-btn:active { transform: scale(0.93); }
        .icon-btn.on { color: var(--accent); border-color: rgba(245,179,36,0.45); }

        /* Shutter */
        .shutter {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            background: transparent;
            border: 3px solid rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.1s var(--ease);
        }
        .shutter::before {
            content: "";
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.15s var(--ease), border-radius 0.15s var(--ease), background 0.2s var(--ease);
        }
        .shutter:active::before { transform: scale(0.88); }
        .shutter.recording::before {
            border-radius: 8px;
            background: var(--danger);
            transform: scale(0.55);
        }

        /* Flash overlay */
        .flash {
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 40;
        }
        .flash.fire { animation: flash 0.3s ease-out; }
        @keyframes flash {
            0% { opacity: 0.9; }
            100% { opacity: 0; }
        }

        /* Focus ring */
        .focus-ring {
            position: absolute;
            width: 86px;
            height: 86px;
            margin-left: -43px;
            margin-top: -43px;
            border: 1.5px solid var(--accent);
            border-radius: 4px;
            pointer-events: none;
            z-index: 25;
            opacity: 0;
            transform: scale(1.4);
        }
        .focus-ring.fire { animation: focus 0.7s var(--ease) forwards; }
        @keyframes focus {
            0% { opacity: 0; transform: scale(1.4); }
            30% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1); }
        }

        /* Exposure slider */
        .exposure {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            z-index: 18;
            width: 38px;
            height: 180px;
            background: var(--glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            border-radius: 999px;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0.6rem 0;
        }
        .exposure.visible { display: flex; }
        .exposure input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 140px;
            height: 20px;
            background: transparent;
            transform: rotate(-90deg);
            outline: none;
        }
        .exposure input[type=range]::-webkit-slider-runnable-track {
            height: 2px;
            background: rgba(255,255,255,0.25);
            border-radius: 2px;
        }
        .exposure input[type=range]::-moz-range-track {
            height: 2px;
            background: rgba(255,255,255,0.25);
            border-radius: 2px;
        }
        .exposure input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid #000;
            margin-top: -8px;
        }
        .exposure input[type=range]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid #000;
        }

        /* Countdown */
        .countdown {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 8rem;
            font-weight: 200;
            font-variant-numeric: tabular-nums;
            color: #fff;
            text-shadow: 0 4px 40px rgba(0,0,0,0.5);
            z-index: 30;
            pointer-events: none;
        }
        .countdown.visible { display: flex; }
        .countdown .num { animation: tick 1s ease-out; }
        @keyframes tick {
            0% { opacity: 0; transform: scale(1.4); }
            20% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.85); }
        }

        /* Status / errors */
        .status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 1.1rem 1.3rem;
            background: var(--glass-strong);
            backdrop-filter: blur(12px);
            border: 1px solid var(--line);
            border-radius: 14px;
            text-align: center;
            max-width: 85%;
            font-size: 0.85rem;
            line-height: 1.55;
            color: var(--fg);
            z-index: 50;
            display: none;
            white-space: pre-line;
        }
        .status.show { display: block; }
        .status .title {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }

        .hidden { display: none !important; }

        /* Review mode */
        #snapshot.visible { display: block; }

        @media (max-height: 640px) {
            .filters { bottom: calc(env(safe-area-inset-bottom, 0) + 150px); }
            .zoom-rail { bottom: calc(env(safe-area-inset-bottom, 0) + 200px); }
        }
    </style>
</head>
<body>
    <div class="stage">
        <video id="video" autoplay playsinline muted></video>
        <img id="snapshot" alt="Aufnahme" class="hidden">
        <div class="grid" id="grid"></div>
        <div class="focus-ring" id="focusRing"></div>
        <div class="flash" id="flash"></div>
        <div class="countdown" id="countdown"></div>

        <!-- Top HUD -->
        <div class="hud" id="hud">
            <div class="hud-group">
                <button class="pill icon-only" id="gridBtn" aria-label="Gitter">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M3 3h18v18H3z"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
                </button>
                <button class="pill" id="timerBtn" aria-label="Timer">
                    <svg class="icon sm" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
                    <span id="timerLabel">Aus</span>
                </button>
                <button class="pill icon-only hidden" id="torchBtn" aria-label="Licht">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
                </button>
            </div>
            <div class="hud-group">
                <span class="pill" id="resLabel"><span class="dot"></span><span id="resText">—</span></span>
            </div>
        </div>

        <!-- Exposure rail -->
        <div class="exposure" id="exposureRail">
            <input type="range" id="exposure" min="-1" max="1" step="0.05" value="0">
        </div>

        <!-- Zoom -->
        <div class="zoom-rail hidden" id="zoomRail">
            <button class="zoom-btn active" data-zoom="1">1×</button>
            <button class="zoom-btn" data-zoom="2">2×</button>
            <button class="zoom-btn" data-zoom="3">3×</button>
        </div>

        <!-- Filter chips -->
        <div class="filters" id="filters">
            <button class="chip active" data-filter="none">Natural</button>
            <button class="chip" data-filter="contrast(1.08) saturate(1.15)">Vivid</button>
            <button class="chip" data-filter="contrast(1.18) saturate(0.75) brightness(0.98)">Muted</button>
            <button class="chip" data-filter="grayscale(1) contrast(1.15)">Mono</button>
            <button class="chip" data-filter="grayscale(1) contrast(1.35) brightness(0.92)">Noir</button>
            <button class="chip" data-filter="sepia(0.55) contrast(1.05) saturate(0.9)">Chrome</button>
            <button class="chip" data-filter="contrast(0.95) saturate(1.2) hue-rotate(-6deg) brightness(1.05)">Warm</button>
            <button class="chip" data-filter="contrast(1.05) saturate(0.9) hue-rotate(8deg) brightness(0.98)">Cool</button>
        </div>

        <!-- Bottom -->
        <div class="bottom">
            <div class="controls" id="liveControls">
                <div class="left">
                    <button class="thumb empty" id="thumb" aria-label="Letzte Aufnahme"></button>
                </div>
                <button class="shutter" id="shootBtn" aria-label="Auslösen"></button>
                <div class="right">
                    <button class="icon-btn" id="switchBtn" aria-label="Kamera wechseln">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="3.5"/><path d="M15.5 10.5 17 9"/></svg>
                    </button>
                </div>
            </div>

            <div class="controls hidden" id="reviewControls">
                <div class="left">
                    <button class="icon-btn" id="retryBtn" aria-label="Verwerfen">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
                    </button>
                </div>
                <button class="icon-btn" id="downloadBtn" aria-label="Speichern" style="width:74px;height:74px;">
                    <svg class="icon lg" viewBox="0 0 24 24"><path d="M12 3v13"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>
                </button>
                <div class="right">
                    <button class="icon-btn" id="shareBtn" aria-label="Teilen">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v13"/><path d="m7 8 5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script>
    (() => {
        const $ = (id) => document.getElementById(id);
        const video = $('video');
        const snapshot = $('snapshot');
        const flash = $('flash');
        const grid = $('grid');
        const hud = $('hud');
        const resText = $('resText');
        const resLabel = $('resLabel');
        const status = $('status');
        const filters = $('filters');
        const liveControls = $('liveControls');
        const reviewControls = $('reviewControls');
        const shootBtn = $('shootBtn');
        const switchBtn = $('switchBtn');
        const retryBtn = $('retryBtn');
        const downloadBtn = $('downloadBtn');
        const shareBtn = $('shareBtn');
        const gridBtn = $('gridBtn');
        const timerBtn = $('timerBtn');
        const timerLabel = $('timerLabel');
        const torchBtn = $('torchBtn');
        const thumb = $('thumb');
        const zoomRail = $('zoomRail');
        const focusRing = $('focusRing');
        const countdown = $('countdown');
        const exposureRail = $('exposureRail');
        const exposureInput = $('exposure');

        const state = {
            stream: null,
            track: null,
            facing: 'user',
            filter: 'none',
            exposure: 0,
            zoom: 1,
            capabilities: null,
            lastBlob: null,
            timer: 0,          // seconds: 0 | 3 | 10
            torchOn: false,
            busy: false,
        };

        // ========== STATUS ==========
        const showStatus = (title, msg) => {
            status.innerHTML = '<span class="title">' + title + '</span>' + msg;
            status.classList.add('show');
        };
        const hideStatus = () => status.classList.remove('show');

        // ========== CAMERA ==========
        async function startCamera() {
            hideStatus();
            stopCamera();
            try {
                state.stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: state.facing },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                    },
                    audio: false,
                });
            } catch (e1) {
                try {
                    state.stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                } catch (e2) {
                    showStatus('Kein Kamerazugriff',
                        (e2.message || e2.name || 'Unbekannter Fehler') +
                        '\n\nBenötigt HTTPS (oder localhost) und eine Kamera-Berechtigung.');
                    return;
                }
            }
            video.srcObject = state.stream;
            video.classList.toggle('mirror', state.facing === 'user');
            state.track = state.stream.getVideoTracks()[0];
            state.capabilities = state.track.getCapabilities ? state.track.getCapabilities() : {};

            await new Promise(r => {
                if (video.readyState >= 2) return r();
                video.onloadedmetadata = () => r();
            });

            updateResLabel();
            updateTorchButton();
            updateZoomRail();
            applyExposure();
            applyFilter();
        }

        function stopCamera() {
            if (state.stream) {
                state.stream.getTracks().forEach(t => t.stop());
                state.stream = null;
                state.track = null;
            }
        }

        function updateResLabel() {
            if (video.videoWidth && video.videoHeight) {
                const w = video.videoWidth;
                const h = video.videoHeight;
                const mp = ((w * h) / 1e6).toFixed(1);
                resText.textContent = w + ' × ' + h + '  ·  ' + mp + ' MP';
                resLabel.classList.add('on');
            }
        }

        // ========== FILTERS ==========
        function applyFilter() {
            video.style.filter = combinedFilter();
        }
        function combinedFilter() {
            const parts = [];
            if (state.filter && state.filter !== 'none') parts.push(state.filter);
            if (state.exposure !== 0) {
                const b = 1 + state.exposure * 0.45;   // ±45 % Helligkeit
                parts.push('brightness(' + b.toFixed(3) + ')');
            }
            return parts.length ? parts.join(' ') : 'none';
        }
        filters.addEventListener('click', (e) => {
            const chip = e.target.closest('.chip');
            if (!chip) return;
            state.filter = chip.dataset.filter;
            filters.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            applyFilter();
        });

        // ========== EXPOSURE ==========
        let exposureTimeout = null;
        function showExposureBriefly() {
            exposureRail.classList.add('visible');
            clearTimeout(exposureTimeout);
            exposureTimeout = setTimeout(() => exposureRail.classList.remove('visible'), 2500);
        }
        exposureInput.addEventListener('input', () => {
            state.exposure = parseFloat(exposureInput.value);
            applyFilter();
            showExposureBriefly();
        });
        exposureInput.addEventListener('dblclick', () => {
            state.exposure = 0;
            exposureInput.value = 0;
            applyFilter();
        });

        // ========== ZOOM ==========
        function updateZoomRail() {
            const cap = state.capabilities;
            const hasNativeZoom = cap && typeof cap.zoom === 'object';
            zoomRail.classList.remove('hidden');
            const maxZoom = hasNativeZoom ? cap.zoom.max : 3;
            zoomRail.querySelectorAll('.zoom-btn').forEach(btn => {
                const z = parseFloat(btn.dataset.zoom);
                btn.style.display = z <= maxZoom ? '' : 'none';
                btn.classList.toggle('active', z === state.zoom);
            });
        }
        zoomRail.addEventListener('click', (e) => {
            const btn = e.target.closest('.zoom-btn');
            if (!btn) return;
            const z = parseFloat(btn.dataset.zoom);
            state.zoom = z;
            zoomRail.querySelectorAll('.zoom-btn').forEach(b => b.classList.toggle('active', b === btn));
            applyZoom();
        });
        async function applyZoom() {
            const cap = state.capabilities;
            if (cap && typeof cap.zoom === 'object' && state.track) {
                try {
                    const z = Math.min(Math.max(state.zoom, cap.zoom.min), cap.zoom.max);
                    await state.track.applyConstraints({ advanced: [{ zoom: z }] });
                    video.style.transform = state.facing === 'user' ? 'scaleX(-1)' : '';
                    return;
                } catch (e) { /* fall through */ }
            }
            const sign = state.facing === 'user' ? -1 : 1;
            video.style.transform = 'scale(' + state.zoom + ') scaleX(' + sign + ')';
        }

        // ========== GRID ==========
        gridBtn.addEventListener('click', () => {
            const on = !grid.classList.contains('on');
            grid.classList.toggle('on', on);
            gridBtn.classList.toggle('on', on);
        });

        // ========== TIMER ==========
        const TIMERS = [0, 3, 10];
        timerBtn.addEventListener('click', () => {
            const idx = (TIMERS.indexOf(state.timer) + 1) % TIMERS.length;
            state.timer = TIMERS[idx];
            timerLabel.textContent = state.timer === 0 ? 'Aus' : state.timer + 's';
            timerBtn.classList.toggle('on', state.timer > 0);
        });

        // ========== TORCH ==========
        function updateTorchButton() {
            const cap = state.capabilities;
            if (cap && cap.torch) {
                torchBtn.classList.remove('hidden');
            } else {
                torchBtn.classList.add('hidden');
                state.torchOn = false;
                torchBtn.classList.remove('on');
            }
        }
        torchBtn.addEventListener('click', async () => {
            if (!state.track) return;
            state.torchOn = !state.torchOn;
            try {
                await state.track.applyConstraints({ advanced: [{ torch: state.torchOn }] });
                torchBtn.classList.toggle('on', state.torchOn);
            } catch {
                state.torchOn = false;
                torchBtn.classList.remove('on');
            }
        });

        // ========== CAMERA SWITCH ==========
        switchBtn.addEventListener('click', () => {
            state.facing = state.facing === 'user' ? 'environment' : 'user';
            state.torchOn = false;
            state.zoom = 1;
            startCamera();
        });

        // ========== TAP TO FOCUS (visual) ==========
        video.addEventListener('pointerdown', (e) => {
            focusRing.style.left = e.clientX + 'px';
            focusRing.style.top = e.clientY + 'px';
            focusRing.classList.remove('fire');
            void focusRing.offsetWidth;
            focusRing.classList.add('fire');
            showExposureBriefly();
        });

        // ========== CAPTURE ==========
        shootBtn.addEventListener('click', async () => {
            if (state.busy || !video.videoWidth) return;
            state.busy = true;

            if (state.timer > 0) {
                await runCountdown(state.timer);
            }

            flash.classList.remove('fire');
            void flash.offsetWidth;
            flash.classList.add('fire');

            try {
                const blob = await captureFrame();
                state.lastBlob = blob;
                const url = URL.createObjectURL(blob);
                snapshot.src = url;

                video.classList.add('hidden');
                snapshot.classList.remove('hidden');
                liveControls.classList.add('hidden');
                reviewControls.classList.remove('hidden');
                filters.classList.add('hidden-soft');
                zoomRail.classList.add('hidden');
                exposureRail.classList.remove('visible');

                thumb.style.backgroundImage = 'url(' + url + ')';
                thumb.classList.remove('empty');
            } catch (err) {
                showStatus('Aufnahme fehlgeschlagen', err.message || String(err));
            } finally {
                state.busy = false;
            }
        });

        async function captureFrame() {
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            const canvas = document.createElement('canvas');
            canvas.width = vw;
            canvas.height = vh;
            const ctx = canvas.getContext('2d');
            ctx.filter = combinedFilter();
            if (state.facing === 'user') {
                ctx.translate(vw, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0, vw, vh);
            return new Promise((resolve, reject) => {
                canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob null')), 'image/jpeg', 0.94);
            });
        }

        function runCountdown(n) {
            return new Promise(resolve => {
                countdown.classList.add('visible');
                let left = n;
                const render = () => {
                    countdown.innerHTML = '<span class="num" key="' + left + '">' + left + '</span>';
                };
                render();
                const id = setInterval(() => {
                    left -= 1;
                    if (left <= 0) {
                        clearInterval(id);
                        countdown.classList.remove('visible');
                        countdown.innerHTML = '';
                        resolve();
                    } else {
                        render();
                    }
                }, 1000);
            });
        }

        // ========== REVIEW ==========
        retryBtn.addEventListener('click', () => {
            if (snapshot.src && snapshot.src.startsWith('blob:')) {
                // keep it for thumb
            }
            snapshot.classList.add('hidden');
            video.classList.remove('hidden');
            liveControls.classList.remove('hidden');
            reviewControls.classList.add('hidden');
            filters.classList.remove('hidden-soft');
            updateZoomRail();
        });

        thumb.addEventListener('click', () => {
            if (!state.lastBlob) return;
            snapshot.src = URL.createObjectURL(state.lastBlob);
            video.classList.add('hidden');
            snapshot.classList.remove('hidden');
            liveControls.classList.add('hidden');
            reviewControls.classList.remove('hidden');
            filters.classList.add('hidden-soft');
            zoomRail.classList.add('hidden');
        });

        downloadBtn.addEventListener('click', () => {
            if (!state.lastBlob) return;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(state.lastBlob);
            const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
            a.download = 'frame-' + ts + '.jpg';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1500);
        });

        shareBtn.addEventListener('click', async () => {
            if (!state.lastBlob) return;
            const file = new File([state.lastBlob], 'frame.jpg', { type: 'image/jpeg' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try { await navigator.share({ files: [file] }); return; } catch {}
            }
            downloadBtn.click();
        });

        // ========== LIFECYCLE ==========
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopCamera();
            } else if (!state.stream && video.classList.contains('hidden') === false) {
                startCamera();
            }
        });

        // Keyboard: space = shutter, g = grid
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') { e.preventDefault(); shootBtn.click(); }
            else if (e.key === 'g' || e.key === 'G') gridBtn.click();
        });

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showStatus('Nicht unterstützt', 'Dieser Browser bietet keine Kamera-API.');
        } else {
            startCamera();
        }
    })();
    </script>
</body>
</html>
